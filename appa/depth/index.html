<html lang="en">
<head>
<meta charset="utf-8">

<title>APPA in Depth · APPA Art Fest 2027</title>
<meta name="description" content="Turn any photo or video into glowing 3D light. Walk the APPA Art Fest 2027 painting exhibition, watch the dhol leave echoes, then add your own painting. 12 Feb to 19 Mar 2027, Kamshet.">
<meta property="og:type" content="website"><meta property="og:site_name" content="APPA Art Fest 2027">

<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one full-bleed 3D stage, a slim top bar with scene tabs, a bottom control sheet. Dark by choice: the work is light on black. */
:root{
  --bg:#0c0a09; --ink:#f4ebd9; --mute:#b3a893; --ver:#ee5a30; --gold:#e8b44f; --teal:#3fb7a6;
  --line:rgba(244,235,217,.18); --panel:rgba(16,13,11,.78);
  --display:'Fraunces',Georgia,serif; --body:'Mukta',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.top{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font:700 20px/1 var(--display);letter-spacing:.01em}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ver)}
.tabs{display:flex;gap:6px;pointer-events:auto;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit}
.tab,.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px)}
.tab[aria-selected=true]{background:var(--ver);border-color:var(--ver);color:#1a0d08;font-weight:600}
.chip[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.tab:focus-visible,.chip:focus-visible,input:focus-visible,.reset:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,rgba(12,10,9,.95) 55%,rgba(12,10,9,0));display:flex;flex-direction:column;gap:10px}
.cap h2{margin:0;font:700 19px/1.2 var(--display);text-wrap:balance}
.cap p{margin:4px 0 0;color:var(--mute);max-width:62ch}
.cap .note{font-size:12.5px;color:var(--gold);margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.ctl{display:flex;gap:16px 22px;flex-wrap:wrap;align-items:center}
.ctl label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.ctl input[type=range]{width:120px;accent-color:var(--ver)}
.ctl .tog{display:flex;align-items:center;gap:6px;cursor:pointer}
.reset{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--mute);cursor:pointer;font-size:13px}
.hint{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:64px;font-size:12px;color:var(--mute);pointer-events:none;text-align:right}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--mute)}
@media (max-width:520px){.cap p{font-size:13px;line-height:1.4}.cap .note{font-size:12px}.sheet{background:linear-gradient(to top,rgba(12,10,9,.97) 72%,rgba(12,10,9,0));gap:8px}.hint{display:none}.ctl input[type=range]{width:96px}}

.chip.primary{background:var(--ver);border-color:var(--ver);color:#1a0d08;font-weight:600}
.chip.on{border-color:var(--gold);color:var(--gold)}
label.chip{display:inline-flex;align-items:center}
input[type=file].vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.tab{display:inline-block;cursor:pointer}
.tab.add{background:var(--ver);border-color:var(--ver);color:#1a0d08;font-weight:600}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(238,90,48,.65)}100%{box-shadow:0 0 0 14px rgba(238,90,48,0)}}
.tab.add.nudge{animation:pulse 1.8s ease-out 4}
@media (max-width:520px){.tab{padding:7px 12px;font-size:14px}.opt{display:none}}
#fxrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#fxrow::-webkit-scrollbar{display:none}
.fold{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--mute);cursor:pointer}
.sheet.min .cap p,.sheet.min .cap .note,.sheet.min .ctl{display:none}
.sheet{padding-top:30px}
#modal{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px max(16px,env(safe-area-inset-left,0px));background:rgba(8,6,5,.9);z-index:5;text-align:center}
#modal.on{display:flex}
#modal img,#modal video{max-width:100%;max-height:68%;border-radius:6px;border:1px solid var(--line)}
#modal p{margin:0;color:var(--mute);max-width:46ch;font-size:13px}
#modal .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#modal a.chip,#modal button.chip{text-decoration:none;color:var(--ink)}
#toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;display:none;z-index:4;max-width:86%;text-align:center}
#vo{display:none}
body.vid .top,body.vid .sheet,body.vid .hint,body.vid .fold{display:none}
body.vid #vo{display:block;position:absolute;inset:0;pointer-events:none}
body.vid .vt{position:absolute;left:7%;right:7%;bottom:15%;font:700 56px/1.08 var(--display);text-shadow:0 2px 24px #000}
body.vid .vs{position:absolute;left:7%;right:7%;bottom:9.5%;font:400 28px/1.3 var(--body);color:var(--gold);text-shadow:0 2px 16px #000}
body.vid .vk{position:absolute;left:7%;top:7%;font:600 22px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ver);text-shadow:0 2px 14px #000}
</style>
</head>
<body>

<div id="app">
  <div id="stage" role="img" aria-label="Interactive 3D point-cloud scene. Drag to look around."></div>
  <div id="err">This page needs WebGL to draw the scenes. Try another browser.</div>
  <div class="top">
    <div class="brand"><b>APPA in depth</b><span>12 Feb – 19 Mar 2027 · Kamshet</span></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div class="hint">Drag to look around · tap a painting · scroll or pinch to zoom</div>
  <div class="sheet">
    <div class="cap"><h2 id="h"></h2><p id="p"></p><div class="note" id="n"></div></div>
    <div class="chips" id="chips"></div>
    <div id="fxrow"></div>
    <div class="ctl" id="ctl"></div>
    <button class="fold" id="fold" type="button">Less</button>
  </div>
  <div id="vo"><div class="vk"></div><div class="vt"></div><div class="vs"></div></div>
  <div id="toast" role="status"></div>
  <input type="file" id="file" class="vh" accept="image/*,video/*" aria-label="Add your painting">
  <div id="modal"><div id="mbody"></div><p id="mnote"></p><div class="row" id="mrow"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {

if (!window.THREE) { $('err').style.display = 'flex'; return; }
var THREE = window.THREE;
var renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) { $('err').style.display = 'flex'; return; }

$('stage').appendChild(renderer.domElement);

/* ---------- small helpers ---------- */
function rng(seed) { var s = seed >>> 0; return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

/* One point material for everything: soft glowing dots, sized in world units so they hold their shape as you zoom.

var shocks = [new THREE.Vector3(0, 0, -100), new THREE.Vector3(0, 0, -100), new THREE.Vector3(0, 0, -100), new THREE.Vector3(0, 0, -100)], brushV = new THREE.Vector3(0, 0, 0);
var dead = [new THREE.Vector3(0, 0, -100), new THREE.Vector3(0, 0, -100), new THREE.Vector3(0, 0, -100), new THREE.Vector3(0, 0, -100)], zero = new THREE.Vector3(0, 0, 0);
var sh = { uTime: { value: 0 }, uScale: { value: 600 }, uMul: { value: 1 } };
/* U = still scenery (no effects). UF = the paintings and your own picture, which the playground effects act on. */
var U = { uTime: sh.uTime, uScale: sh.uScale, uMul: sh.uMul, uWind: { value: 0 }, uWave: { value: 0 }, uMelt: { value: 0 }, uScatter: { value: 0 }, uGrade: { value: 0 }, uShock: { value: dead }, uBrush: { value: zero } };

  'attribute vec3 aCol;attribute float aSize;attribute float aSeed;',
  'uniform float uTime,uScale,uMul,uWind,uWave,uMelt,uScatter,uGrade;uniform vec3 uShock[4];uniform vec3 uBrush;varying vec3 vCol;',
  'float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',
  'void main(){',
  ' vec3 p=position;vec3 c=aCol;float l=dot(c,vec3(.3,.59,.11));float n=h(position.xy*17.3);float glow=0.;',
  ' p.x+=uWind*sin(uTime*1.7+p.y*2.4+p.x*.7)*.05*(1.+n*.5);p.z+=uWind*sin(uTime*1.3+p.x*3.1)*.06;p.y+=uWind*sin(uTime*2.1+p.x*4.)*.015;',
  ' float d0=length(p.xy);p.z+=uWave*sin(d0*7.-uTime*2.6)*.14*exp(-d0*.28);',
  ' float drip=uMelt*(1.-l)*(.1+.5*fract(n*9.+uTime*.12));p.y-=drip*(.5+.5*sin(uTime*.7+n*6.));',
  ' for(int i=0;i<4;i++){float age=uTime-uShock[i].z;if(age>0.&&age<3.){vec2 dv=position.xy-uShock[i].xy;float dd=length(dv);float k=1.-age/3.;float ring=exp(-pow((dd-age*2.4)*2.6,2.));p.z+=ring*.7*k;p.xy+=dv/(dd+.001)*ring*.1*k;glow+=ring*k;}}',

  ' p+=uScatter*vec3(h(position.xy*3.1)-.5,h(position.yx*5.7)-.5,h(position.xy*9.3)-.5)*2.2*(1.+.15*sin(uTime+n*6.));',
  ' if(uGrade>.5&&uGrade<1.5){c=mix(vec3(.08,.03,.12),mix(vec3(.93,.34,.18),vec3(1.,.8,.35),smoothstep(.45,.9,l)),smoothstep(.05,.5,l));}',
  ' else if(uGrade>1.5&&uGrade<2.5){c=vec3(l)*vec3(1.,.95,.85)*1.2;}',
  ' else if(uGrade>2.5){c=mix(vec3(l),c,2.2);c*=.55+.7*vec3(.5+.5*sin(position.y*3.+uTime),.5+.5*sin(position.y*3.+2.1+uTime),.5+.5*sin(position.y*3.+4.2+uTime));}',
  ' vCol=c*(1.+glow*1.6);',
  ' vec4 mv=modelViewMatrix*vec4(p,1.);float tw=aSeed>.5?1.+.4*sin(uTime*2.2+aSeed*40.):1.;',

  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexShader: VERT,
  fragmentShader: 'varying vec3 vCol;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=smoothstep(.5,.1,d);gl_FragColor=vec4(vCol*a,a);}'
});

var pointMatFx = new THREE.ShaderMaterial({ uniforms: UF, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexShader: VERT, fragmentShader: pointMat.fragmentShader });
function Buf() { this.p = []; this.c = []; this.s = []; this.t = []; }
Buf.prototype.add = function (x, y, z, r, g, b, size, tw) {
  this.p.push(x, y, z); this.c.push(r, g, b); this.s.push(size); this.t.push(tw ? 1 + Math.random() * 0.9 : 0);
};
Buf.prototype.count = function () { return this.p.length / 3; };
Buf.prototype.points = function (dynamic, mat) {
  var g = new THREE.BufferGeometry();
  var pa = new THREE.BufferAttribute(new Float32Array(this.p), 3), ca = new THREE.BufferAttribute(new Float32Array(this.c), 3);
  if (dynamic) { pa.setUsage(THREE.DynamicDrawUsage); ca.setUsage(THREE.DynamicDrawUsage); }
  g.setAttribute('position', pa); g.setAttribute('aCol', ca);
  g.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(this.s), 1));
  g.setAttribute('aSeed', new THREE.BufferAttribute(new Float32Array(this.t), 1));
  var m = new THREE.Points(g, mat || pointMat); m.frustumCulled = false; return m;
};
function line(buf, a, b, n, col, size, tw) {
  for (var i = 0; i <= n; i++) { var t = i / n; buf.add(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t), col[0], col[1], col[2], size, tw); }
}

/* ---------- orbit camera ---------- */
var camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
var view = { target: new THREE.Vector3(), r: 8, th: 0, ph: 1.2, drag: { x: 0, y: 0 } };
var goal = { target: new THREE.Vector3(), r: 8, th: 0, ph: 1.2 };
var cfg = { thMin: -9, thMax: 9, phMin: 0.35, phMax: 1.75, rMin: 1.2, rMax: 30, sway: 0.0 };
var lastTouch = 0;
function NR() { var st = document.getElementById('stage'); return st.clientWidth / (st.clientHeight || 1) < 0.8 ? 1.45 : 1; }
function snap() { view.target.copy(goal.target); view.r = goal.r; view.th = goal.th; view.ph = goal.ph; view.drag.x = 0; view.drag.y = 0; }
var focus = -1, paints = [], mode = '', own = { cloud: null, video: null, stream: null, url: null }; var stage = $('stage'), ptrs = {}, pinch0 = 0, tap = null, brush = { down: false, k: 0 }, si = 0, T = 0, fxMode = false, playMode = false;
var ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitV = new THREE.Vector3(), ndc = new THREE.Vector2();
var inv = new THREE.Matrix4(), lray = new THREE.Ray(), lplane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitL = new THREE.Vector3();
/* where a finger lands on a picture, in the picture's own flat coordinates (the effects work in that space) */
function hitOn(mesh, cx, cy) { var r = stage.getBoundingClientRect(); ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); mesh.updateMatrixWorld(true); inv.copy(mesh.matrixWorld).invert(); lray.copy(ray.ray).applyMatrix4(inv); return lray.intersectPlane(lplane, hitL) ? hitL : null; }

function worldXY(cx, cy) { var P = activePic(); return P ? hitOn(P.mesh, cx, cy) : null; }
function tapScene(cx, cy) {
  var P = activePic(), w = P && worldXY(cx, cy);
  if (w && Math.abs(w.x) < P.G.W / 2 + 0.2 && Math.abs(w.y) < P.G.H / 2 + 0.2) { shock(w.x, w.y); return; }

  if (best >= 0 && best !== focus) marketGo(best);

function shock(x, y) { shocks[si % 4].set(x, y, T); si++; }
function dist2() { var k = Object.keys(ptrs); if (k.length < 2) return 0; var a = ptrs[k[0]], b = ptrs[k[1]]; return Math.hypot(a.x - b.x, a.y - b.y); }

function placeCamera(sx) {
  var th = view.th + sx, ph = view.ph, r = view.r;
  camera.position.set(view.target.x + r * Math.sin(ph) * Math.sin(th), view.target.y + r * Math.cos(ph), view.target.z + r * Math.sin(ph) * Math.cos(th));

/* ================= SCENE 1: the painting market ================= */
var PAINTINGS = [
  { name: 'Dusk over the lake', pal: ['#f2b25a', '#d9532c', '#fff1c4', '#2a2f3d'] },
  { name: 'Dhol night', pal: ['#1b1226', '#4a1730', '#ee5a30', '#e8b44f'] },
  { name: 'Forest strokes', pal: ['#c9d9a0', '#2f5a3a', '#f6e7a8', '#16301f'] },
  { name: 'Lamps at the mela', pal: ['#0f1a3a', '#241a4a', '#e8b44f', '#ee5a30'] },
  { name: 'Water lines', pal: ['#0f3a4a', '#3fb7a6', '#f1e6c8', '#0b2530'] },
  { name: 'Ridge in mist', pal: ['#f0c9a0', '#8a5a6a', '#fff2dc', '#2d2a45'] },
  { name: 'Your painting', pal: null }
];
