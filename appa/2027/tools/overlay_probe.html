<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
<style>html,body{margin:0;background:#111}</style></head>
<body>
<canvas id="ov" width="1920" height="1080" style="width:960px;height:540px"></canvas>
<script type="module">
  import { overlay, camAt } from '../project/tour.js';
  const cv = document.getElementById('ov');
  const O = cv.getContext('2d');
  window.drawAt = (t) => {
    O.setTransform(1,0,0,1,0,0); O.clearRect(0,0,cv.width,cv.height);
    O.fillStyle = '#2b2b3a'; O.fillRect(0,0,cv.width,cv.height);
    overlay(O, t, cv.width, cv.height);
    const c = camAt(t);
    document.title = 'READY t=' + t + ' cam=' + JSON.stringify(c);
  };
  window.__ready = true;
</script>
</body></html>
